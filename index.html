<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folia Remote (Spotify Search + Player)</title>
<style>
*{box-sizing:border-box;font-family:system-ui, sans-serif}
body{background:#111;color:#fff;padding:20px;max-width:460px;margin:0 auto}
.card{background:#222;border-radius:16px;padding:20px;margin-bottom:16px}
.cover{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;background:#333}
.title{font-size:1.3rem;font-weight:bold;margin:8px 0 4px}
.artist{color:#aaa;margin-bottom:12px}
.status{color:#888;font-size:0.9rem}
.progress{width:100%;height:8px;background:#333;border-radius:999;cursor:pointer;margin:16px 0}
.progress>div{height:100%;background:#6366f1;border-radius:999;width:0%}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}
button{padding:14px;border:none;border-radius:12px;font-size:1rem;background:#333;color:#fff}
button:active{background:#444}
.search-row{display:flex;gap:8px;margin-bottom:16px}
#searchInput{flex:1;padding:12px;border-radius:12px;border:none;background:#222;color:#fff;font-size:1rem}
#searchBtn{padding:12px;background:#444}
.result-item{padding:12px;border-bottom:1px solid #333;cursor:pointer}
.result-item:active{background:#333}
</style>
</head>
<body>

<div class="card">
  <img id="cover" class="cover">
  <div class="title" id="title">—</div>
  <div class="artist" id="artist">Waiting for Folia...</div>
  <div class="status" id="timeText">00:00 / 00:00</div>
  <div class="progress" id="progressBar"><div id="progressFill"></div></div>
  <div class="controls">
    <button onclick="sendCmd('prev')">⏮ Prev</button>
    <button onclick="sendCmd('toggle')">⏯ Play/Pause</button>
    <button onclick="sendCmd('next')">Next ⏭</button>
  </div>
</div>

<div class="card">
  <div class="search-row">
    <input id="searchInput" placeholder="Search Spotify / songs..." onkeydown="if(event.key==='Enter')doSearch()">
    <button id="searchBtn" onclick="doSearch()">🔍</button>
  </div>
  <div id="results"></div>
</div>

<script>
// ========= CONFIG: CHANGE TO YOUR PC LAN IP =========
const FOLIA_HOST = "192.168.1.100:9863";
// =====================================================

let status = {};

async function fetchStatus(){
  try{
    const r = await fetch(`http://${FOLIA_HOST}/stage/player/status`);
    status = await r.json();
    renderPlayer();
  }catch(e){
    document.getElementById("artist").innerText = "Cannot connect | Turn ON Stage Mode in Folia";
  }
}

async function sendCmd(action){
  let act = action === "toggle" ? (status.playing ? "pause" : "resume") : action;
  await fetch(`http://${FOLIA_HOST}/stage/player/control`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action:act})
  });
  fetchStatus();
}

async function doSearch(){
  const q = document.getElementById("searchInput").value.trim();
  if(!q) return;
  const resEl = document.getElementById("results");
  resEl.innerHTML = "<div style='padding:8px'>Searching...</div>";
  try{
    const r = await fetch(`http://${FOLIA_HOST}/stage/player/search`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({query: q})
    });
    const data = await r.json();
    resEl.innerHTML = "";
    if(!data?.list?.length){
      resEl.innerHTML = "<div style='padding:8px'>No results</div>";
      return;
    }
    for(const item of data.list){
      const div = document.createElement("div");
      div.className = "result-item";
      div.innerText = `${item.title} — ${item.artist || ''}`;
      div.onclick = async ()=>{
        await fetch(`http://${FOLIA_HOST}/stage/player/play`,{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({
            sourceId: item.sourceId,
            trackId: item.trackId
          })
        });
        fetchStatus();
      };
      resEl.appendChild(div);
    }
  }catch(e){
    resEl.innerHTML = "<div style='padding:8px'>Search failed, check Stage API</div>";
  }
}

function renderPlayer(){
  const s = status;
  document.getElementById("title").innerText = s.track?.title || "No track";
  document.getElementById("artist").innerText = s.track?.artist || "";
  if(s.track?.coverUrl) document.getElementById("cover").src = s.track.coverUrl;
  const pos = s.positionMs ?? 0;
  const dur = s.durationMs ?? 1;
  const pct = Math.min(pos/dur*100,100);
  document.getElementById("progressFill").style.width = pct+"%";
  document.getElementById("timeText").innerText = fmt(pos)+" / "+fmt(dur);
}

function fmt(ms){
  const s = Math.floor(ms/1000);
  const m = String(Math.floor(s/60)).padStart(2,"0");
  const sec = String(s%60).padStart(2,"0");
  return m+":"+sec;
}

setInterval(fetchStatus, 1200);
fetchStatus();
</script>
</body>
</html>
